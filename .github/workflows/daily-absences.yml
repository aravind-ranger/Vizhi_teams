name: Daily Absence Sweep

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

jobs:
  run-daily-absences:
    runs-on: ubuntu-latest
    container: node:20
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: npm run build

      - name: Run daily absence sweep
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { FieldValue, getFirestore, Timestamp } = require('firebase-admin/firestore');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          initializeApp({ credential: cert(serviceAccount), projectId: process.env.FIREBASE_PROJECT_ID });

          const db = getFirestore();

          const dayKey = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
          };

          const monthKey = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
          };

          const dayBounds = (date) => {
            const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const end = new Date(start);
            end.setDate(end.getDate() + 1);
            return { start, end };
          };

          const isApprovedLeaveForDay = (leave, date) => {
            const from = leave.from_date?.toDate ? leave.from_date.toDate() : new Date(leave.from_date);
            const to = leave.to_date?.toDate ? leave.to_date.toDate() : new Date(leave.to_date);
            const day = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
            const fromDay = new Date(from.getFullYear(), from.getMonth(), from.getDate()).getTime();
            const toDay = new Date(to.getFullYear(), to.getMonth(), to.getDate()).getTime();
            return day >= fromDay && day <= toDay;
          };

          async function runMarkDailyAbsences() {
            const now = new Date();
            const { start, end } = dayBounds(now);
            const key = dayKey(now);

            const [usersSnap, attendanceSnap, leavesSnap] = await Promise.all([
              db.collection('users').where('is_active', '==', true).get(),
              db.collection('attendance')
                .where('created_at', '>=', Timestamp.fromDate(start))
                .where('created_at', '<', Timestamp.fromDate(end))
                .get(),
              db.collection('leaves').where('status', '==', 'approved').get(),
            ]);

            const usersWithAttendance = new Set(
              attendanceSnap.docs.map((doc) => doc.data().user_id).filter(Boolean),
            );
            const approvedLeaves = leavesSnap.docs.map((doc) => doc.data());
            let batch = db.batch();
            let writes = 0;

            for (const userDoc of usersSnap.docs) {
              const user = userDoc.data();
              if (user.role === 'admin' || usersWithAttendance.has(userDoc.id)) continue;
              if (approvedLeaves.some((leave) => leave.user_id === userDoc.id && isApprovedLeaveForDay(leave, now))) continue;

              const attendanceId = `${userDoc.id}_${key}`;
              const attendanceRef = db.collection('attendance').doc(attendanceId);
              batch.set(attendanceRef, {
                user_id: userDoc.id,
                user_name: user.name || 'Employee',
                check_in: null,
                check_out: null,
                scheduled_checkout: null,
                status: 'absent',
                early_exit: false,
                duration_minutes: 0,
                work_location: 'office',
                total_break_ms: 0,
                auto_marked: true,
                day_key: key,
                month_key: monthKey(now),
                created_at: Timestamp.fromDate(now),
                updated_at: FieldValue.serverTimestamp(),
              }, { merge: false });

              const auditRef = db.collection('audit_logs').doc(`${attendanceId}_auto_absent`);
              batch.set(auditRef, {
                user_id: userDoc.id,
                user_name: user.name || 'Employee',
                action: 'auto_absent',
                details: `${user.name || 'Employee'} was auto-marked absent after the end-of-day sweep`,
                created_at: FieldValue.serverTimestamp(),
              }, { merge: true });
              writes += 2;

              if (writes >= 450) {
                await batch.commit();
                batch = db.batch();
                writes = 0;
              }
            }

            if (writes > 0) await batch.commit();
          }

          runMarkDailyAbsences()
            .then(() => console.log('Daily absence sweep completed.'))
            .catch((err) => {
              console.error('Daily absence sweep failed:', err);
              process.exitCode = 1;
            });
          NODE
