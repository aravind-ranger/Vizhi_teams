name: Daily Absence Sweep

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

jobs:
  run-daily-absences:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Firebase secrets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "Missing repository secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          }
          test -n "$FIREBASE_PROJECT_ID" || {
            echo "Missing repository secret: FIREBASE_PROJECT_ID"
            exit 1
          }

      - name: Install runtime dependency
        run: npm install --no-save firebase-admin@11

      - name: Run daily absence sweep
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          TZ: Asia/Kolkata
        run: node .github/scripts/daily-absence-sweep.cjs
